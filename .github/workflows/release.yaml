# Tags v<VERSION> after Test succeeds on a push to main. No tool binary:
# forge and solc are downloaded by the rules from their own release URLs.
name: Release

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Release the plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: thought-machine/release-action@0dfdc6c2e233ff85c0e1ac9338e54081962d7ba6
        with:
          version-file: VERSION
          change-log-file: ChangeLog
